
<div class="container mt-5">

  <div class="row gx-5 gy-4">

    
    
    <div class="col-md-4 mb-4 mb-md-0">

      <div class="card shadow">

        <div class="card-header bg-primary text-white text-center">
      <h4 class="mb-0">
        {{isInEditMode ? 'Update Student' : 'Add Student'}}
      </h4>
    </div>

        <div class="card-body">

          <div class="form-group">
            <label for="fname">First Name <span class="text-danger">*</span></label>
            <input
              #fname
              type="text"
              class="form-control"
              id="fname"
              placeholder="Enter First Name">
          </div>

          <div class="form-group mt-3">
            <label for="lname">Last Name <span class="text-danger">*</span></label>
            <input
              #lname
              type="text"
              class="form-control"
              id="lname"
              placeholder="Enter Last Name">
          </div>

          <div class="form-group mt-3">
            <label for="email">Email <span class="text-danger">*</span></label>
            <input
              #email
              type="text"
              class="form-control"
              id="email"
              placeholder="Enter Email">
          </div>

          <div class="form-group mt-3">
            <label for="contact">Contact <span class="text-danger">*</span></label>
            <input
              #contact
              type="text"
              class="form-control"
              id="contact"
              placeholder="Enter Contact">
          </div>

          <button
            *ngIf="!isInEditMode"
            (click)="onAdd()"
            mat-raised-button
            color="primary"
            class="w-100 mt-4">
            Add Student
          </button>

          <button
            *ngIf="isInEditMode"
            (click)="onUpdate()"
            mat-raised-button
            color="accent"
            class="w-100 mt-4">
            Update Student
          </button>

        </div>

      </div>

    </div>



    <div class="col-md-8">

      <div class="table-responsive mt-4 mt-md-0">

        <table class="table table-bordered text-white">

          <thead  class="table-head">
            <tr>
              <th>Sr No</th>
              <th>First Name</th>
              <th>Email</th>
              <th>Contact</th>
              <th>Student Id</th>
              <th>Edit</th>
              <th>Remove</th>
            </tr>
          </thead>

          <tbody>

            <tr *ngFor="let std of stdArr; index as i">

              <td>{{i + 1}}</td>
              <td>{{std.fname}} {{std.lname}}</td>
              <td>{{std.email}}</td>
              <td>{{std.contact}}</td>
              <td>{{std.stdId}}</td>

              <td class="text-center">
                <button
                  (click)="onEdit(std)"
                  mat-mini-fab
                  color="primary">
                  <mat-icon>edit_square</mat-icon>
                </button>
              </td>

              <td class="text-center">
                <button
                  (click)="onRemove(std.stdId)"
                  mat-mini-fab
                  color="warn">
                  <mat-icon>delete</mat-icon>
                </button>
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>

</div>
